<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GESTÃO DE COMPRAS | GRUPO ZTT, CELLA & FÊNIX</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Ícones do Google Fontes para o Dashboard -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

<!-- TELA DE LOGIN OVERLAY (INTACTA) -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-wrapper">
        <img src="assets/img/logo-grupo.png" alt="Logo do Grupo" class="login-logo-external">
        <div class="login-card">
            <h2>GESTÃO DE COMPRAS</h2>
            <p>Análises do Setor</p>
            <form class="login-form" onSubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="login-btn">Acessar Sistema</button>
                <div class="login-error" id="loginError" style="display: none;">Usuário ou senha incorretos!</div>
            </form>
        </div>
    </div>
</div>

<!-- CONTAINER PRINCIPAL DO DASHBOARD -->
<div class="dashboard-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>GESTÃO DE COMPRAS</h2>
            <p>Painel de Desmobilização</p>
        </div>
        
        <div class="sidebar-menu">
            <button class="nav-btn active" onclick="openTab('painel-inicial', this)">
                <span class="material-symbols-outlined">dashboard</span> Painel Inicial
            </button>
        </div>

        <button class="nav-btn logout-btn" onclick="handleLogout()">
            <span class="material-symbols-outlined">logout</span> Sair do Sistema
        </button>
    </aside>

    <!-- Área de Conteúdo Central -->
    <main class="main-content">
        
<!-- Header Superior -->
        <header class="top-header">
            <div class="header-title">
                <h1>Monitoramento de Estoque Parado</h1>
            </div>
            <div class="user-profile">
                <div class="avatar"><span class="material-symbols-outlined">account_circle</span></div>
                <div class="user-info">
                    <span class="user-name">Marcos Vinicius</span>
                    <span class="user-role">Departamento de Compras</span>
                </div>
            </div>
        </header>
    </main>
</div>

<script src="assets/js/script.js"></script>
</body>
</html>
