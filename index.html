<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GESTÃO DE COMPRAS | GRUPO ZTT, CELLA & FÊNIX</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

<!-- TELA DE LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-wrapper">
        <img src="assets/img/logo-grupo.png" alt="Logo do Grupo" class="login-logo-external">
        <div class="login-card">
            <h2>GESTÃO DE COMPRAS</h2>
            <p>Análises do Setor</p>
            <form class="login-form" onSubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="login-btn">FAZER LOGIN</button>
                <div class="login-error" id="loginError" style="display: none;">Usuário ou senha incorretos!</div>
            </form>
        </div>
    </div>
</div>

<!-- BASE DO PAINEL COM PARALLAX -->
<div class="dashboard-container" id="dashboardContainer">
    
    <!-- Elementos de Fundo Parallax (Ficam no fundo) -->
    <div class="parallax-container">
        <div class="parallax-bg" id="parallaxBg"></div>
        <div class="parallax-overlay"></div>
    </div>

    <!-- Conteúdo da Dashboard (Fica por cima do fundo) -->
    <div class="dashboard-content">
        
        <!-- Cabeçalho contendo o Logo da Empresa -->
        <header class="dashboard-header">
            <img src="assets/img/logo-grupo.png" alt="Zanol & Thomaz Logo" class="dashboard-logo">
        </header>

        <!-- Seus cards e tabelas da dashboard virão aqui embaixo no futuro -->

    </div>

</div>

<script src="assets/js/script.js"></script>
</body>
</html>
